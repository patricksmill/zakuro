# Builds the port on Windows and Linux.
# Every push and pull request that touches more than docs builds and tests the workspace, with debug
# info; a v* tag builds without debug info, then packs, smoke-launches and
# publishes a GitHub release. Tags with a hyphen (v0.1.0-pre) are published
# as prereleases.
# A daily schedule (or a manual run on main) builds the same way and replaces
# the files of the rolling `nightly` prerelease; the schedule skips days on
# which main has not moved since the last nightly.
#
# This replaces upstream's ci.yml and release.yml: keep them deleted when
# merging upstream/main.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: &docs ["**.md", "docs/**", "LICENSE*"]
  pull_request:
    paths-ignore: *docs
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the build still running;
# tag builds publish releases, so they always finish.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # schedule only: skip the build when the nightly tag already points at main
  changed:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = schedule ]; then
            nightly=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
            [ "$nightly" = "$GITHUB_SHA" ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: needs.changed.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          # an old distro, since programs run on systems as new as their build box or newer
          - os: ubuntu-latest
            container: ubuntu:22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Tools and library headers
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates clang cmake curl file git libasound2-dev libudev-dev pkg-config fonts-noto-cjk
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # branch and pull request builds keep debug = 1; releases ship without it
      - name: Drop debug info from published builds
        if: github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_DEBUG=false" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_STRIP=debuginfo" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p zakuro
      # the whole workspace, kiutrace and funclist included
      - run: cargo test --release --locked --workspace

      - name: Name the archive
        id: name
        shell: bash
        run: echo "base=${{ github.event.repository.name }}-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
      # each archive is launched once packed: the log shows whether the GPU starts, and the job fails if the program doesn't
      - name: Pack for Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory pack | Out-Null
          Copy-Item target/release/UprisingHack.exe, README.md pack/
          Copy-Item LICENSE pack/LICENSE.txt
          Compress-Archive -Path pack/* -DestinationPath ${{ steps.name.outputs.base }}.zip
          $env:RUST_LOG = 'info'
          pack/UprisingHack.exe --test-pattern --headless 1 --mute
      - name: Pack for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir pack
          cp target/release/UprisingHack README.md LICENSE pack/
          tar czf ${{ steps.name.outputs.base }}.tar.gz -C pack .
          RUST_LOG=info pack/UprisingHack --test-pattern --headless 1 --mute
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ steps.name.outputs.base }}.zip
            ${{ steps.name.outputs.base }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          On Windows, unzip the windows-x86_64 archive and run UprisingHack.exe. On Linux, extract the linux-x86_64 archive and run ./UprisingHack; it needs the ALSA library (libasound2 on Debian and Ubuntu). Linux builds are untested.

          You need your own decrypted dump of Kid Icarus: Uprising (USA, 0004000000030100). Press Recompile next to the game in the library before playing, and again after each update: it takes about ten minutes and needs a C compiler, which Zakuro offers to download if you have none.
          NOTES
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease --title "$TAG" --notes-file notes.md --generate-notes

  nightly:
    needs: build
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: nightly
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=${GITHUB_SHA::7}
          cat > notes.md <<NOTES
          **Nightly build of [\`$short\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), $(date -u +%Y-%m-%d).** Built automatically from main and replaced whenever main changes: it may be broken. If it is, use the latest v0.x release instead, and name the commit above in bug reports.

          On Windows, unzip the windows-x86_64 archive and run UprisingHack.exe. On Linux, extract the linux-x86_64 archive and run ./UprisingHack; it needs the ALSA library (libasound2 on Debian and Ubuntu). Linux builds are untested.

          You need your own decrypted dump of Kid Icarus: Uprising (USA, 0004000000030100). Press Recompile next to the game in the library before playing, and again after each update: it takes about ten minutes and needs a C compiler, which Zakuro offers to download if you have none.
          NOTES
          if gh release view nightly >/dev/null 2>&1; then
            old=$(gh release view nightly --json assets --jq '.assets[].name')
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
            gh release upload nightly dist/* --clobber
            for a in $old; do
              case " $(cd dist && echo *) " in *" $a "*) ;; *) gh release delete-asset nightly "$a" --yes ;; esac
            done
            gh release edit nightly --prerelease --title "Nightly ($short)" --notes-file notes.md
          else
            gh release create nightly dist/* --target "$GITHUB_SHA" --prerelease --title "Nightly ($short)" --notes-file notes.md
          fi
