[workspace]
resolver = "2"
members = [
    "crates/zakuro-common",
    "crates/zakuro-fs",
    "crates/zakuro-cpu",
    "crates/zakuro-gpu",
    "crates/zakuro-core",
    "crates/zakuro",
    "kiu/tools/kiutrace",
    "kiu/tools/funclist",
]

[workspace.package]
version = "0.2.32"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/patricksmill/UprisingHack"

[workspace.dependencies]
zakuro-common = { path = "crates/zakuro-common" }
zakuro-fs     = { path = "crates/zakuro-fs" }
zakuro-cpu    = { path = "crates/zakuro-cpu" }
zakuro-gpu    = { path = "crates/zakuro-gpu" }
zakuro-core   = { path = "crates/zakuro-core" }

log = "0.4"
thiserror = "2"
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
recomp-abi = { git = "https://github.com/fearkov/3dsrecomp" }
rayon = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"

[profile.dev]
opt-level = 1
debug = true

# a plain debug build is unusably slow, so the hot crates get O2 even in dev
[profile.dev.package.zakuro-cpu]
opt-level = 3
[profile.dev.package.zakuro-gpu]
opt-level = 3
[profile.dev.package.zakuro-core]
opt-level = 2
# translated vertex shaders compile thru it while games run
[profile.dev.package.naga]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = 1

# everyday builds: release speed in the hot paths without cross-crate LTO, so
# an edit relinks in seconds instead of minutes. Ship and benchmark with release.
[profile.iter]
inherits = "release"
lto = "off"
codegen-units = 16
debug = 0
incremental = true

# the port's recompiler fork: title-specific hints and the ABI's mouse hook support.
# Cargo.lock pins the commit; `cargo update -p recomp3ds` moves it.
[patch."https://github.com/fearkov/3dsrecomp"]
recomp-abi = { git = "https://github.com/patricksmill/3dsrecomp", branch = "kiu" }
recomp3ds = { git = "https://github.com/patricksmill/3dsrecomp", branch = "kiu" }
